services:
  aiostreams:
    image: viren070/aiostreams:latest
    container_name: aiostreams
    ports:
      - "${AIOSTREAMS_PORT}:3000"
    environment:
      - TZ=${TZ}
      - BASE_URL=${AIOSTREAMS_BASE_URL}
      - SECRET_KEY=${AIOSTREAMS_SECRET_KEY}
    volumes:
      - /caminho/para/config/aiostreams:/app/data
    restart: unless-stopped
