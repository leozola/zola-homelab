# Baseado no compose oficial do Immich (v3.3.5):
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    volumes:
      - ${IMMICH_UPLOAD_LOCATION:-./library}:/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE_NAME=${DB_DATABASE_NAME}
      - REDIS_HOSTNAME=immich-redis
    depends_on:
      - immich-redis
      - immich-postgres
    networks:
      - rede-server
    restart: always
    healthcheck:
      disable: false

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    volumes:
      - immich-model-cache:/cache
    environment:
      - TZ=${TZ}
    networks:
      - rede-server
    restart: always
    healthcheck:
      disable: false

  immich-redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
    healthcheck:
      test: redis-cli ping | grep -q PONG || exit 1
    networks:
      - rede-server
    restart: always

  immich-postgres:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Descomente se o banco NÃO estiver em SSD
      # DB_STORAGE_TYPE: 'HDD'
    volumes:
      - ${IMMICH_DB_LOCATION:-./postgres}:/var/lib/postgresql/data
    shm_size: 128mb
    networks:
      - rede-server
    restart: always
    healthcheck:
      disable: false

volumes:
  immich-model-cache:

networks:
  rede-server:
    external: true
