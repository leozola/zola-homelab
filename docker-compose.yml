# Cada serviço fica em sua própria pasta. O .env da raiz é repassado a todos.
# A rede "rede-server" é externa: crie uma única vez com
#   docker network create rede-server
include:
  - path: nextcloud/compose.yml
    env_file: .env
  - path: aiostreams/compose.yml
    env_file: .env
  - path: portainer/compose.yml
    env_file: .env
  - path: immich/compose.yml
    env_file: .env
  - path: pihole/compose.yml
    env_file: .env
  - path: nginx-proxy-manager/compose.yml
    env_file: .env
